# Moodle 5.1+ virtual host (web root is the public/ directory).
server {
    listen 80 default_server;
    server_name _;

    root  /var/www/moodle/public;
    index index.php;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # PHP-FPM health endpoint (used by the Docker HEALTHCHECK).
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Hide dot files, but allow RFC 5785 well-known URIs.
    location ~ /\.(?!well-known).* {
        return 404;
    }

    # X-Accel-Redirect target for $CFG->xsendfile. 'internal' is critical:
    # it prevents clients from reading moodledata directly.
    location ^~ /dataroot/ {
        internal;
        alias /var/www/moodledata/;
    }

    # PHP, including slash arguments; unknown scripts fall back to the router.
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name $fastcgi_script_name/ /r.php$is_args$args;

        include fastcgi_params;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    # Internal files that must never be served (MDL-69333). Kept after the PHP rule.
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml) {
        deny all;
        return 404;
    }

    # Moodle Router (required since 5.1).
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }
}
